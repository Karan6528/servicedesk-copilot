# Deploys to Azure Container Apps. Run manually: Actions -> deploy-azure -> Run workflow.
# One-time setup is in docs/azure.md (resource group, registry, service principal, secrets).
name: deploy-azure

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RESOURCE_GROUP: rg-servicedesk-copilot
  CONTAINER_APP: servicedesk-copilot
  ACR_NAME: ${{ vars.ACR_NAME }}          # e.g. acrservicedeskkaran (set under Settings -> Variables)

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build image in Azure Container Registry
        run: |
          az acr build --registry "$ACR_NAME" \
            --image servicedesk-copilot:${{ github.sha }} \
            --image servicedesk-copilot:latest .

      - name: Deploy new revision
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/servicedesk-copilot:${{ github.sha }}"

      - name: Smoke test
        run: |
          FQDN=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 20); do curl -fs "https://$FQDN/healthz" && exit 0; sleep 6; done
          exit 1
