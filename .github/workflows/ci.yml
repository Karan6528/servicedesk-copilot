name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t servicedesk-copilot:ci .
      - name: Smoke test with Postgres (docker compose)
        run: |
          docker compose up -d
          for i in $(seq 1 30); do curl -fs localhost:8000/readyz && break; sleep 2; done
          curl -fs -X POST localhost:8000/api/tickets -H 'content-type: application/json' \
            -d '{"message":"My car broke down and will not start, I am stranded"}' | tee /tmp/t.json
          grep -q '"urgency":"high"' /tmp/t.json
          docker compose down -v

  k8s:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: servicedesk
      - name: Build and load image into kind
        run: |
          docker build -t servicedesk-copilot:local .
          kind load docker-image servicedesk-copilot:local --name servicedesk
      - name: Deploy
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl -n servicedesk create secret generic servicedesk-secrets \
            --from-literal=POSTGRES_PASSWORD=ci-password \
            --from-literal=DATABASE_URL=postgresql+psycopg://servicedesk:ci-password@postgres:5432/servicedesk
          kubectl apply -k k8s/
          kubectl -n servicedesk rollout status statefulset/postgres --timeout=180s
          kubectl -n servicedesk rollout status deployment/servicedesk-api --timeout=180s
      - name: Smoke test through the Service
        run: |
          kubectl -n servicedesk port-forward svc/servicedesk-api 8080:80 &
          sleep 5
          curl -fs localhost:8080/readyz
      - name: Debug on failure
        if: failure()
        run: kubectl -n servicedesk get all && kubectl -n servicedesk describe pods && kubectl -n servicedesk logs -l app=servicedesk-api --tail=50
