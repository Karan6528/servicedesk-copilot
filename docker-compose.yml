# docker compose up --build   ->  http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: servicedesk
      POSTGRES_USER: servicedesk
      POSTGRES_PASSWORD: servicedesk-local-only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicedesk -d servicedesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: servicedesk-copilot:local
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+psycopg://servicedesk:servicedesk-local-only@db:5432/servicedesk
    ports:
      - "8000:8000"

volumes:
  pgdata:
